<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Lash — Content Pipeline · Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #FBF5F1; --surface-1: #FFFFFF; --surface-2: #F3E1DA; --shell: #F7EDE7;
    --text: #2B211D; --text-muted: rgba(43,33,29,0.66); --text-dim: rgba(43,33,29,0.45);
    --border: rgba(43,33,29,0.10); --border-strong: rgba(43,33,29,0.20);
    --accent: #BD6F63; --accent-soft: rgba(189,111,99,0.12);
    --good: #4C6B4A; --warn: #B08A3E; --bad: #B24B3F;
    --radius: 18px; --shadow: 0 20px 40px -28px rgba(43,33,29,0.35);
    --font-display: 'Manrope', -apple-system, sans-serif; --font-accent: 'Fraunces', Georgia, serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--text); font-family: var(--font-display); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }

  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 232px; flex-shrink: 0; background: var(--shell); border-right: 1px solid var(--border); padding: 24px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .sidebar .logo { display: flex; align-items: center; gap: 9px; padding: 6px 8px 22px; }
  .sidebar .logo img { height: 30px; }
  .sidebar .logo span { font-family: var(--font-accent); font-style: italic; font-weight: 600; font-size: 17px; }
  .navlink { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
  .navlink:hover { background: rgba(43,33,29,0.05); }
  .navlink.active { background: var(--surface-1); color: var(--text); box-shadow: var(--shadow); }
  .navlink .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); }
  .navlink.active .dot { background: var(--accent); }
  .sidebar-foot { margin-top: auto; padding: 12px 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }

  .main { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; border-bottom: 1px solid var(--border); }
  .topbar h1 { margin: 0; font-size: 22px; }
  .topbar .meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .content { padding: 32px 36px 60px; }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
  .col { background: var(--surface-2); border-radius: var(--radius); padding: 14px; min-height: 200px; }
  .col-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px 12px; }
  .col-head .ctitle { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); font-weight: 700; }
  .col-head .ccount { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); background: rgba(43,33,29,0.06); padding: 2px 7px; border-radius: 999px; }
  .col-body { display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
  .kcard { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; font-size: 13px; cursor: grab; box-shadow: 0 8px 18px -14px rgba(43,33,29,0.3); }
  .kcard.dragging { opacity: 0.4; }
  .kcard .ktag { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 6px; display: block; }
  .col.dragover { outline: 2px dashed var(--accent); outline-offset: -4px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .add-row input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border-strong); font-family: var(--font-display); font-size: 13.5px; background: var(--surface-1); }
  .add-row button { padding: 11px 18px; border-radius: 10px; background: var(--accent); color: #fff; border: none; font-weight: 700; font-size: 13px; cursor: pointer; }

  .fade { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s ease; }
  .fade.in { opacity: 1; transform: translateY(0); }

  @media (max-width: 980px) { .board { grid-template-columns: 1fr; } .sidebar { position: fixed; z-index: 10; transform: translateX(-100%); } }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo"><img src="assets/logo-icon.png" alt="Pro Lash"><span>Mission Control</span></div>
    <a href="dashboard.html" class="navlink"><span class="dot"></span>Overview</a>
    <a href="agents.html" class="navlink"><span class="dot"></span>Agents</a>
    <a href="content.html" class="navlink active"><span class="dot"></span>Content Pipeline</a>
    <a href="growth.html" class="navlink"><span class="dot"></span>Growth</a>
    <div class="sidebar-foot">PRO LASH · V1<br>Built from design.md</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1>Content Pipeline</h1><div class="meta">Seeded from pro-lash-content's real drafts · drag cards between stages, persists locally</div></div>
    </div>

    <div class="content">
      <div class="add-row fade">
        <input type="text" id="newIdea" placeholder="Add a new content idea…">
        <button onclick="addCard()">Add to Ideas</button>
      </div>

      <div class="board fade" id="board">
        <div class="col" data-stage="idea">
          <div class="col-head"><span class="ctitle">Idea</span><span class="ccount" id="count-idea">0</span></div>
          <div class="col-body" id="col-idea"></div>
        </div>
        <div class="col" data-stage="drafted">
          <div class="col-head"><span class="ctitle">Drafted</span><span class="ccount" id="count-drafted">0</span></div>
          <div class="col-body" id="col-drafted"></div>
        </div>
        <div class="col" data-stage="scheduled">
          <div class="col-head"><span class="ctitle">Scheduled</span><span class="ccount" id="count-scheduled">0</span></div>
          <div class="col-body" id="col-scheduled"></div>
        </div>
        <div class="col" data-stage="posted">
          <div class="col-head"><span class="ctitle">Posted</span><span class="ccount" id="count-posted">0</span></div>
          <div class="col-body" id="col-posted"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const STORAGE_KEY = 'pro_lash_pipeline_board';
  const SEED = [
    { id: 1, stage: 'drafted', belief: 'Belief 1', text: 'Your lash tech won\'t tell you this, but extensions are quietly wrecking your real lashes.' },
    { id: 2, stage: 'drafted', belief: 'Belief 2', text: 'You don\'t have to choose between your extensions and healthy lashes. Here\'s why.' },
    { id: 3, stage: 'idea', belief: 'Belief 3', text: 'Most lash serums use the same ingredient behind all those eye-irritation horror stories. Ours doesn\'t.' },
    { id: 4, stage: 'idea', belief: 'Belief 4', text: 'Vegan and organic doesn\'t mean it doesn\'t work. Here\'s the formula.' },
    { id: 5, stage: 'idea', belief: 'Belief 5', text: 'I did lash extensions for 6 years. Here\'s the thing nobody in the industry says out loud.' },
  ];

  function loadBoard() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : SEED;
  }
  function saveBoard(cards) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  }

  let cards = loadBoard();

  function render() {
    ['idea','drafted','scheduled','posted'].forEach(stage => {
      const col = document.getElementById('col-' + stage);
      col.innerHTML = '';
      const inStage = cards.filter(c => c.stage === stage);
      document.getElementById('count-' + stage).textContent = inStage.length;
      inStage.forEach(card => {
        const el = document.createElement('div');
        el.className = 'kcard';
        el.draggable = true;
        el.dataset.id = card.id;
        el.innerHTML = (card.belief ? '<span class="ktag">' + card.belief + '</span>' : '') + card.text;
        el.addEventListener('dragstart', () => el.classList.add('dragging'));
        el.addEventListener('dragend', () => { el.classList.remove('dragging'); saveBoard(cards); });
        col.appendChild(el);
      });
    });
  }

  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      col.classList.add('dragover');
      const dragging = document.querySelector('.dragging');
      if (dragging) col.querySelector('.col-body').appendChild(dragging);
    });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('dragover');
      const dragging = document.querySelector('.dragging');
      if (!dragging) return;
      const id = parseInt(dragging.dataset.id);
      const card = cards.find(c => c.id === id);
      if (card) card.stage = col.dataset.stage;
      saveBoard(cards);
      render();
    });
  });

  function addCard() {
    const input = document.getElementById('newIdea');
    const text = input.value.trim();
    if (!text) return;
    const id = Date.now();
    cards.push({ id, stage: 'idea', belief: '', text });
    saveBoard(cards);
    input.value = '';
    render();
  }
  document.getElementById('newIdea').addEventListener('keydown', (e) => { if (e.key === 'Enter') addCard(); });

  render();

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); observer.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade').forEach((el, i) => { el.style.transitionDelay = (i*30)+'ms'; observer.observe(el); });
</script>
</body>
</html>
